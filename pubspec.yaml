name: visaia
description: "A new Flutter project."
publish_to: "none"

version: 2.0.0+11

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  http: ^1.6.0
  camera: ^0.11.3+1
  image: ^4.7.2
  google_fonts: ^8.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  phosphor_flutter: ^2.1.0
  iconify_flutter: ^0.0.7
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  firebase_core: ^4.5.0
  cloud_firestore: ^6.6.0
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.0
  file_picker: ^10.3.10
  firebase_auth: ^6.2.0
  provider: ^6.1.5+1
  flutter_markdown: ^0.7.7+1
  ph_address_finder: ^5.0.1
  pdf: ^3.11.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/bg.png
    - assets/images/login-bg.png
    - assets/images/img1.png
    - assets/images/img2.png
    - assets/images/logo.png
    - assets/images/faw.png
    - assets/images/onboarding1.png
    - assets/images/onboarding2.png
    - assets/images/onboarding3.1.png
    - assets/images/onboarding3.2.png
    - assets/images/onboarding3.3.png
    - assets/images/onboarding4.png
    - assets/images/spinetoram.png
    - assets/images/nobg-gardo.png
    - assets/images/zigzag.png
